# Labels and welcomes a library's pull requests (CONTRIBUTING.md):
# - `needs introduction`: the author is not an owner, member or collaborator and has no
#   introduction labelled `introduction accepted` in core (going-haywire/haywire), where
#   introductions for every repository live. Removed again on a later run once accepted.
# - `agent files`: the pull request changes files that steer agents or CI; the maintainer
#   reads them line by line and removes the label.
#
# Called from a library's pr-intake.yml on pull_request_target, which grants
# `issues: write` and `pull-requests: write`. It never checks out or runs the pull
# request's code: it reads metadata and the list of changed paths through the API. Values
# from the event reach the shell only through environment variables.
name: PR intake

on:
  workflow_call:

permissions: {}

jobs:
  pull-request:
    name: label the pull request
    # Bots (Dependabot) need no introduction; the maintainer reviews their PRs anyway.
    if: github.event_name == 'pull_request_target' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      ASSOCIATION: ${{ github.event.pull_request.author_association }}
      INTRODUCTIONS: going-haywire/haywire
    steps:
      - name: Introduction
        run: |
          case "$ASSOCIATION" in OWNER | MEMBER | COLLABORATOR) exit 0 ;; esac
          accepted=$(gh issue list --repo "$INTRODUCTIONS" --author "$AUTHOR" \
            --label "introduction accepted" --state all --limit 1 --json number --jq length)
          if [ "$accepted" != "0" ]; then
            if gh pr view "$NUMBER" --json labels --jq '.labels[].name' | grep -qx "needs introduction"; then
              gh pr edit "$NUMBER" --remove-label "needs introduction"
            fi
            exit 0
          fi
          gh pr edit "$NUMBER" --add-label "needs introduction"
          marker="<!-- pr-intake:introduction -->"
          if ! gh pr view "$NUMBER" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$NUMBER" --body "$marker
          Thanks for the pull request, and welcome! Before a first contribution we'd like to get to know you: please open a short [introduction](https://github.com/$INTRODUCTIONS/issues/new?template=introduction.yml) in core — who you are, what you'd like to work on, and why. One introduction covers every going-haywire repository. Your pull request stays open meanwhile; the \`needs introduction\` label comes off with your next push once the introduction is accepted. See [CONTRIBUTING.md](https://github.com/going-haywire/.github/blob/main/CONTRIBUTING.md)."
          fi

      - name: Agent files
        run: |
          changed=$(gh pr diff "$NUMBER" --name-only)
          echo "$changed" | grep -qE '^(CLAUDE\.md|AGENTS\.md|\.mcp\.json|\.claude/|\.github/)' || exit 0
          gh pr edit "$NUMBER" --add-label "agent files"
          marker="<!-- pr-intake:agent-files -->"
          if ! gh pr view "$NUMBER" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$NUMBER" --body "$marker
          Thanks! This pull request changes files that steer AI agents or CI (\`CLAUDE.md\`, \`AGENTS.md\`, \`.claude/\`, \`.github/\`), so the maintainer reads those lines one by one before merging; the \`agent files\` label stays until then."
          fi
